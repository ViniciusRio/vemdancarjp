spring:
  application:
    name: vemdancarjp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/vemdancarjp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

agenda:
  city: "João Pessoa, PB"
  title: "Vem Dançar JP"
  subtitle: "Agenda fixa semanal de Forró Pé de Serra"

server:
  port: 8080
