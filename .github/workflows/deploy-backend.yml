name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - deploy/**
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest of an already published image (sha256:...)"
        required: true
        type: string

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/viniciusrio/vemdancarjp-backend
  API_URL: https://api.vemdancarjp.com.br/api/agenda

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build JAR
        working-directory: backend
        run: ./gradlew build -q

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: image
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.image.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy over SSH
        env:
          DIGEST: ${{ needs.image.outputs.digest || inputs.digest }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid digest"; exit 1; }
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$DIGEST"

      - name: Check public agenda
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 12 --retry-delay 10 --retry-all-errors --max-time 15 "$API_URL"
