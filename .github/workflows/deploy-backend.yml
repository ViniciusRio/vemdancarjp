name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - deploy/check-*.sh
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest of an image already published by this repository (sha256:...)"
        required: true
        type: string
      simulate_post_traffic_failure:
        description: "Fail after the traffic switch to test the automatic restore"
        required: false
        default: false
        type: boolean

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/viniciusrio/vemdancarjp-backend
  SERVICE: vemdancarjp-api
  REGION: us-east1
  CANDIDATE_TAG: candidate

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and build JAR
        working-directory: backend
        run: ./gradlew build -q

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPO }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: image
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.image.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      DIGEST: ${{ needs.image.outputs.digest || inputs.digest }}
    steps:
      - name: Validate image digest
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Invalid digest"; exit 1; }
          echo "NEW_IMAGE=$IMAGE_REPO@$DIGEST" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Record current traffic and image
        id: before
        run: |
          service_json="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
          traffic="$(jq -r '[.status.traffic[] | select(.percent > 0) | "\(.revisionName)=\(.percent)"] | join(",")' <<<"$service_json")"
          main_revision="$(jq -r '[.status.traffic[] | select(.percent > 0)] | max_by(.percent) | .revisionName' <<<"$service_json")"
          service_url="$(jq -r '.status.url' <<<"$service_json")"
          current_image="$(gcloud run revisions describe "$main_revision" --region "$REGION" --format='value(spec.containers[0].image)')"
          [[ -n "$traffic" && -n "$current_image" && -n "$service_url" ]] || { echo "Could not read the current state"; exit 1; }
          echo "Current traffic: $traffic"
          echo "Current image: $current_image"
          {
            echo "traffic=$traffic"
            echo "image=$current_image"
            echo "service_url=$service_url"
          } >>"$GITHUB_OUTPUT"

      - name: Check schema compatibility with the current image
        env:
          CURRENT_IMAGE: ${{ steps.before.outputs.image }}
        run: |
          if [[ "$CURRENT_IMAGE" != "$IMAGE_REPO@"* ]]; then
            echo "No application image in production yet; skipping."
            exit 0
          fi
          deploy/check-schema-compat.sh "$NEW_IMAGE" "$CURRENT_IMAGE"

      - name: Create revision without traffic
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DATABASE_URL: ${{ vars.PRODUCTION_DATABASE_JDBC_URL }}
          DATABASE_USERNAME: ${{ vars.PRODUCTION_DATABASE_USERNAME }}
        run: |
          [[ "$DATABASE_URL" == *sslmode=require* ]] || { echo "The database URL must require TLS"; exit 1; }
          env_vars="APP_PUBLIC_SURFACE=agenda-only"
          env_vars+="@@APP_FRONTEND_URL=https://vemdancarjp.com.br"
          env_vars+="@@SPRING_DATASOURCE_URL=$DATABASE_URL"
          env_vars+="@@SPRING_DATASOURCE_USERNAME=$DATABASE_USERNAME"
          env_vars+="@@SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=2"
          env_vars+="@@SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0"
          env_vars+="@@SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=60000"
          env_vars+="@@SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=0"
          gcloud run deploy "$SERVICE" \
            --region "$REGION" \
            --image "$NEW_IMAGE" \
            --no-traffic \
            --tag "$CANDIDATE_TAG" \
            --service-account "$SERVICE-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --cpu 1 \
            --memory 512Mi \
            --cpu-throttling \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --port 8080 \
            --startup-probe "httpGet.path=/api/agenda,httpGet.port=8080,periodSeconds=10,timeoutSeconds=5,failureThreshold=12" \
            --update-env-vars "^@@^$env_vars" \
            --update-secrets "SPRING_DATASOURCE_PASSWORD=$SERVICE-database-password:latest"

      - name: Check candidate configuration
        id: candidate
        run: |
          service_json="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json)"
          revision="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[] | select(.tag == $tag) | .revisionName' <<<"$service_json")"
          url="$(jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[] | select(.tag == $tag) | .url' <<<"$service_json")"
          [[ -n "$revision" && -n "$url" ]] || { echo "Candidate tag not found"; exit 1; }
          revision_json="$(gcloud run revisions describe "$revision" --region "$REGION" --format=json)"
          surface="$(jq -r '.spec.containers[0].env[] | select(.name == "APP_PUBLIC_SURFACE") | .value' <<<"$revision_json")"
          image="$(jq -r '.spec.containers[0].image' <<<"$revision_json")"
          [[ "$surface" == "agenda-only" ]] || { echo "APP_PUBLIC_SURFACE is '$surface'"; exit 1; }
          [[ "$image" == "$NEW_IMAGE" ]] || { echo "Revision image is '$image'"; exit 1; }
          {
            echo "revision=$revision"
            echo "url=$url"
          } >>"$GITHUB_OUTPUT"

      - name: Check candidate public surface
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: deploy/check-public-surface.sh "$CANDIDATE_URL"

      - name: Move traffic to candidate
        id: switch
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          echo "started=true" >>"$GITHUB_OUTPUT"
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-revisions "$REVISION=100"

      - name: Check production after the switch
        env:
          SERVICE_URL: ${{ steps.before.outputs.service_url }}
          PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          SIMULATE_FAILURE: ${{ inputs.simulate_post_traffic_failure }}
        run: |
          deploy/check-public-surface.sh "$SERVICE_URL"
          if [[ -n "$PUBLIC_URL" ]]; then
            deploy/check-public-surface.sh "$PUBLIC_URL"
          fi
          if [[ "$SIMULATE_FAILURE" == "true" ]]; then
            echo "Simulated failure after the traffic switch"
            exit 1
          fi

      - name: Restore previous traffic
        if: ${{ (failure() || cancelled()) && steps.switch.outputs.started == 'true' }}
        env:
          PREVIOUS_TRAFFIC: ${{ steps.before.outputs.traffic }}
          SERVICE_URL: ${{ steps.before.outputs.service_url }}
        run: |
          restore_command=(gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-revisions "$PREVIOUS_TRAFFIC")
          if ! "${restore_command[@]}"; then
            echo "::error::Traffic was not restored. Run manually: ${restore_command[*]}"
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$SERVICE_URL/api/agenda"
          echo "Traffic restored to $PREVIOUS_TRAFFIC"

      - name: Remove candidate tag
        if: ${{ always() && steps.google-auth.outcome == 'success' }}
        run: |
          tags="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json | jq -r '[.status.traffic[] | .tag // empty] | join(",")')"
          if [[ ",$tags," == *",$CANDIDATE_TAG,"* ]]; then
            gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags "$CANDIDATE_TAG"
          fi
