services:
    postgres:
        image: postgres:17-alpine
        container_name: postgres_db
        restart: always
        shm_size: 128mb
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5433:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
